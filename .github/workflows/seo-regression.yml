name: Critical SEO regression
on:
  pull_request:
    paths:
      - "app/**"
      - "lib/seo/**"
      - "components/HtmlLanguageSync.tsx"
      - "components/RussianInternalLinks.tsx"
      - "proxy.ts"
      - "next.config.ts"
      - "scripts/check-seo-route-langs.mjs"
      - "scripts/check-rendered-seo.mjs"
      - "scripts/check-ru-phu-quoc-content.mjs"
      - "scripts/check-ru-booking-landing.mjs"
      - "scripts/check-ru-hoi-an-content.mjs"
      - "scripts/check-ru-danang-content.mjs"
      - "scripts/check-home-performance.mjs"
      - "scripts/check-home-chunks.mjs"
      - "scripts/check-tracking-defer.mjs"
      - "scripts/audit-seo-geo.mjs"
      - ".github/workflows/seo-regression.yml"
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node --experimental-strip-types scripts/check-seo-route-langs.mjs
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
      - run: node scripts/check-rendered-seo.mjs
      - run: node scripts/check-ru-phu-quoc-content.mjs
      - run: node scripts/check-ru-booking-landing.mjs
      - run: node scripts/check-ru-hoi-an-content.mjs
      - run: node scripts/check-ru-danang-content.mjs
      - run: node scripts/check-home-performance.mjs
      - run: node scripts/check-home-chunks.mjs
      - run: node scripts/check-tracking-defer.mjs
      - name: Diagnose canonical-host redirects
        run: |
          for address in "http://govietstay.com/" "https://govietstay.com/" "https://www.govietstay.com/"; do
            echo "URL: $address"
            curl -sSLI --max-time 20 --max-redirs 5 -o /dev/null -w 'HTTP=%{http_code} redirects=%{num_redirects} final=%{url_effective} total=%{time_total}s\n' "$address" || true
          done
      - run: node scripts/audit-seo-geo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multilingual-seo-geo-report
          path: seo-audit/
